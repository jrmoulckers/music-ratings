<!doctype html>
<html lang="en" data-theme="light" data-motion="system" data-density="cozy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141417" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Privately rate and rank your music. Every score is explained, every rating stays on your own device."
    />
    <title>Music Ratings — privately rate and rank your music</title>

    <!--
      DIRECTION CONTRACT

      THESIS: A plain, honest tool for working out what you actually think of
      your music. Every page says what it is for. Refuses the dark album-tile
      grid this category always ships, and the popularity chart it borrows from.

      OWN-WORLD: Neutral greys, one accent, one typeface. Libre Franklin
      throughout, with small-caps labels for metadata and tabular figures for
      every number. Rules and detents are drawn at one device pixel. Radius is
      small and consistent. States are shown by weight and fill, never by
      decoration.

      STORY: You set a rating on the rail, the app records it, and the margin
      shows exactly which evidence produced every computed score.

      FIRST VIEWPORT: An accent centre rail runs the full height, carrying the
      rating queue as lit detents that stay lit until rated. Twinned
      short-measure columns sit either side of it; the wide annotation margin
      holds coverage and sync state. The primary action runs into the rail.

      FORM: rw-centre-rail-reference-setting — dealt challenger, fused and built
      over grounded candidate 5 (Consumer Guide newsprint column), which it beat
      on product clarity. Staging: spatial-navigation-transit-stack, fused into
      the rail. Seed key fe9e53d3. De-themed after review: the printed-document
      palette and Caslon setting read as a legal document rather than a music
      tool, so the world was reduced to neutrals and a single sans.
    -->
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p
        style="
          font-family: system-ui, sans-serif;
          margin: 3rem auto;
          max-width: 34em;
          padding: 0 1rem;
        "
      >
        This application keeps every rating on your own device and needs JavaScript to read and
        write that local store. Please enable JavaScript for this origin.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
